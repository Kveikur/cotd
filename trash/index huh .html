
		<!DOCTYPE html>
<html = style="height: 100%;">

  <head>
    <title>Зов Из Глубин</title>
    <meta name="viewport" content="width=device-width, initial-scale=10.0">
    <link rel="stylesheet" href="scripts/leaflet.css">
    <script src="scripts/leaflet.js"></script>
  </head>
  
  <body style="height: 100%;margin: 0;">
    <div id="map" style="width: 100%; height: 100%; background: #000000;"></div>
    <script type="text/javascript">
	<style>
#map {
    width: 3840px;
    height:2160px;
}

/* css to customize Leaflet default styles  */
.custom .leaflet-popup-tip,
.custom .leaflet-popup-content-wrapper {
    background: #e93434;
    color: #ffffff;
}
</style>
  //Creating the Map
    var map = L.map('map', {maxZoom: 7, minZoom: 2, zoomSnap: 0.25,zoomDelta: 0.25}).setView([50, 194], 2);
        var imageUrl = 'data/map.png';
        var imageBounds = [[0, 0], [216, 384]];
        L.imageOverlay(imageUrl, imageBounds).addTo(map);
		var customPopup = "<b>My office</b><br/>";
// specify popup options 
var customOptions = {
    'maxWidth': 400,
    'width': 200,
    'className' : 'popupCustom'
}
var marker = L.marker([5,5]).addTo(map);
// bind the custom popup 
marker.bindPopup(customPopup,customOptions);
        L.marker([69, 206]).addTo(map)
            .bindPopup("<b> Ритланд </b> <br> Столица - Сталесвет. <br>  Известен искусством 'ковки душ', позволяющей создавать разумных автоматонов. <br> Военный центр противостояния Светлых рас с дроу, дуэргарами и их союзниками.");
    </script>
  </body>
</html>
