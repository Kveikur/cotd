
		<!DOCTYPE html>
<html = style="height: 100%;">
  <head>
    <title>DnD World Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=10.0">
    <link rel="stylesheet" href="scripts/leaflet.css">

<style>
@font-face {

        }

}

    <div id="map" style="width: 100%; height: 100%; background: #1b243a;"></div>
    <script type="text/javascript">
  //Creating the Map
    var map = L.map('map', {maxZoom: 4, minZoom: 2.75, zoomSnap: 0.25,zoomDelta: 0.25}).setView([70, 194], 2);
        var imageUrl = 'data/map.png';
        var imageBounds = [[0, 0], [216, 384]];
        L.imageOverlay(imageUrl, imageBounds).addTo(map);
		  var customOptions =
        {
        'maxWidth': '500',
        'className' : 'custom'
        }
		var capitalIcon = L.icon({
    iconUrl: 'icons/cityCapital.png',
	iconSize:    [25, 41],
	iconAnchor:   [15, 45],
	popupAnchor:  [-2, -29]
});
        var ritland = L.marker([69, 206], {icon: capitalIcon,title:'Ритланд'})
            .bindPopup("<h2> Ритланд </h2> <b> Столица </b> - Сталесвет. <br> <b>Известные организации</b> - 'Верные Солнцу', 'Острая Луна'. <img src='data/bot.jpg'/> <br> Самодержавие людей. Известна искусством 'ковки душ', позволяющей создавать разумных автоматонов. Военный центр противостояния Светлых рас с дроу, дуэргарами и их союзниками.",customOptions);
		var whitetwrs = L.marker([77.3, 190], {icon: capitalIcon,title:'Белые Башни'})
            .bindPopup("<h2> Белые Башни </h2> <b> Две столицы  </b> - Хрона и Нумен. <br> <b>Известные организации</b> - 'Академия', 'Ткацкий дом Пирне'. <img src='data/numen.jpg'/> <br> Меритократия эльфов, которой управляет совет мудрейших и сильнейших. Страна балансирует между мнениями двух противоположностей - воинственных мореплавателей из Нумена и эпатажных любителей моды из Хроны.",customOptions);
		var cadur = L.marker([83.3, 190], {icon: capitalIcon,title:"Кадур-Нарг'арк"})
            .bindPopup("<h2> Кадур-Нарг'арк </h2> <b> Столица </b> - Торндин. <br> <b>Известные организации</b> - 'Клан Дунлур', 'Слышащие Камень'. <img src='data/cadur.jpg'/> <br> Иерархия щитовых и холмовых дварфов, система кланов, которой управляет старейшина сильнейшего из кланов. Главный поставщик металла для Ритланда и драгоценных камней для Белых Башен.",customOptions);
		var horter = L.marker([76.5, 245], {icon: capitalIcon,title:"Хортер"})
            .bindPopup("<h2> Хортер </h2> <b> Столица </b> - Гиббльдин. <br> <b>Известные организации</b> - 'Камнеходы', 'Лазуритовый Караван'. <img src='data/horter.jpg'/> <br> Плутократия гномов. Транзитное государство, обладающее знаниями тайных проходов через туннели и перевалы Гор Скорби. Ценность отдельной личности в этой стране определяется её возможностью заработать золото. Те, кто не смог выплатить взятый займ при жизни, воскрешаются в качестве нежити, бездумно выполняющей приказы заимодателя.",customOptions);
    //Marker Groups
  var mg_cities = L.layerGroup([ritland,whitetwrs,cadur,horter]);
  var mg_towers = L.layerGroup([el_ochri_college]);
//Marker Overlay
  var overlays={
    "Столицы и государства" : mg_towns,
    "Towers" : mg_towers,
    }
//GROUP CONTROLS
  L.control.layers(null, overlays).addTo(map);
	</script>
  </body>
</html>
